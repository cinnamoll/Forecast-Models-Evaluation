name: mamba
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pytorch=2.5.1
  - pytorch-cuda=12.4
  - cuda-toolkit=12.4
  - matplotlib
  - ninja
  - numpy
  - packaging
  - pandas
  - scikit-learn
  - scipy
  - seaborn
  - setuptools>=61
  - wheel
  - pip
  - pip:
    - einops
    - transformers